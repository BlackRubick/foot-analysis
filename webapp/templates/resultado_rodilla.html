<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado Rodilla</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Resultados del Análisis de Rodilla</h2>
    {% if metrics %}
    <div class="metrics">
        <strong>Plano:</strong> {{ metrics.plane }}<br>
        <strong>Lado:</strong> {{ metrics.side }}<br>
        <strong>Ángulo rodilla:</strong> {{ metrics.knee_angle_deg }}°<br>
        <strong>Clasificación:</strong> {{ metrics.classification }}<br>
    </div>
    {% endif %}
    {% if annotated_url %}
    <h3>Imagen procesada:</h3>
    <img src="{{ annotated_url }}" alt="Resultado anotado" style="max-width:500px; border:2px solid #0ea5e9;">
    {% endif %}
    <br>
    <a href="/">Volver al inicio</a>
</body>
</html>
