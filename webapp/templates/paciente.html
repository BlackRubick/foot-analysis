{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto">
    <div class="bg-white rounded-lg shadow border p-8">
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Datos del Paciente</h2>
        <p class="text-gray-600 mb-6">Por favor, ingresa los datos del paciente para iniciar la evaluación clínica.</p>
        <form method="post" class="space-y-5">
            <div>
                <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre completo</label>
                <input type="text" name="nombre" id="nombre" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Nombre y apellidos">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="edad" class="block text-sm font-medium text-gray-700 mb-1">Edad</label>
                    <input type="number" name="edad" id="edad" min="0" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Edad">
                </div>
                <div>
                    <label for="sexo" class="block text-sm font-medium text-gray-700 mb-1">Sexo</label>
                    <select name="sexo" id="sexo" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                        <option value="">Selecciona</option>
                        <option>Masculino</option>
                        <option>Femenino</option>
                        <option>Otro</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="estatura" class="block text-sm font-medium text-gray-700 mb-1">Estatura (cm)</label>
                    <input type="number" name="estatura" id="estatura" min="0" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Ej: 170">
                </div>
                <div>
                    <label for="peso" class="block text-sm font-medium text-gray-700 mb-1">Peso (kg)</label>
                    <input type="number" name="peso" id="peso" min="0" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Ej: 70">
                </div>
            </div>
            <div class="pt-4">
                <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2 px-4 rounded shadow">Guardar y continuar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
