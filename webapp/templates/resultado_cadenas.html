<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado Cadenas Musculares</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Resultados del Análisis de Cadenas Musculares</h2>
    {% if metrics %}
    <div class="metrics">
        <pre>{{ metrics | tojson(indent=2) }}</pre>
    </div>
    {% endif %}
    {% if notes %}
    <div class="notes">
        <ul>
        {% for note in notes %}
            <li>{{ note }}</li>
        {% endfor %}
        </ul>
    </div>
    {% endif %}
    {% if annotated_url %}
    <h3>Imagen procesada:</h3>
    <img src="{{ annotated_url }}" alt="Resultado anotado" style="max-width:500px; border:2px solid #0ea5e9;">
    {% endif %}
    <br>
    <a href="/">Volver al inicio</a>
</body>
</html>
